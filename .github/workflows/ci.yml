# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
# Built using these posts as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    # semantic version tags + rc/beta snapshots
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
      full_history:
        description: "Run full history secret scan"
        required: false
        default: false
        type: boolean
  schedule:
    # preferred heavy monthly run (quota reset strategy)
    - cron: '17 3 1 * *'
    # optional nightly lightweight checks
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  discussions: write
  pull-requests: write
  checks: write
  packages: write
  security-events: write

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_post_release: ${{ steps.route.outputs.run_post_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          run_post_release=false
          is_monthly=false
          is_nightly=false

          case "$EVENT_NAME" in
            push)
              run_code_checks=true
              if [[ "$REF" == refs/tags/v* ]]; then
                run_release=true
              fi
              ;;
            pull_request)
              if [[ "$EVENT_ACTION" == "closed" ]]; then
                if [[ "$PR_MERGED" != "true" ]]; then
                  run_cleanup=true
                fi
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            release)
              run_post_release=true
              ;;
            workflow_dispatch)
              run_code_checks=true
              if [[ "$INPUT_MODE" == release-* ]]; then
                run_release=true
              fi
              if [[ "$INPUT_MODE" == "publish-tag" ]]; then
                if [[ "$REF_TYPE" != "tag" || ! "$REF" =~ ^refs/tags/v.* ]]; then
                  echo "publish-tag mode requires an eligible tag context (e.g. refs/tags/v*)" >&2
                  exit 1
                fi
                run_release=true
              fi
              if [[ "$INPUT_MODE" == "monthly-maintenance" ]]; then
                is_monthly=true
              fi
              if [[ "$INPUT_MODE" == "lint-fix" ]]; then
                is_nightly=true
              fi
              ;;
            schedule)
              run_code_checks=true
              if [[ "$EVENT_SCHEDULE" == "17 3 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "$EVENT_SCHEDULE" == "41 2 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_post_release=$run_post_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover capabilities and cost profile
    needs: route
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dart: ${{ steps.detect.outputs.has_dart }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_qt_cpp: ${{ steps.detect.outputs.has_qt_cpp }}
      has_make_c: ${{ steps.detect.outputs.has_make_c }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_goreleaser: ${{ steps.detect.outputs.has_goreleaser }}
      has_dart_or_flutter_tests: ${{ steps.detect.outputs.has_dart_or_flutter_tests }}
      has_packaging: ${{ steps.detect.outputs.has_packaging }}
    steps:
      - uses: actions/checkout@v7

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          EXPECT_GO=true
          EXPECT_NODE=true
          EXPECT_DART=false
          EXPECT_FLUTTER=false
          EXPECT_QT_CPP=false
          EXPECT_MAKE_C=false
          EXPECT_DOCKER=false
          EXPECT_GORELEASER=true

          echo "has_go=${EXPECT_GO:-false}" >> "$GITHUB_OUTPUT"
          echo "has_node=${EXPECT_NODE:-false}" >> "$GITHUB_OUTPUT"
          echo "has_dart=${EXPECT_DART:-false}" >> "$GITHUB_OUTPUT"
          echo "has_flutter=${EXPECT_FLUTTER:-false}" >> "$GITHUB_OUTPUT"
          echo "has_qt_cpp=${EXPECT_QT_CPP:-false}" >> "$GITHUB_OUTPUT"
          echo "has_make_c=${EXPECT_MAKE_C:-false}" >> "$GITHUB_OUTPUT"
          echo "has_docker=${EXPECT_DOCKER:-false}" >> "$GITHUB_OUTPUT"
          echo "has_goreleaser=${EXPECT_GORELEASER:-false}" >> "$GITHUB_OUTPUT"

          ([[ -d test ]] || [[ -d tests ]] || [[ -f pubspec.yaml ]]) && echo "has_dart_or_flutter_tests=true" >> "$GITHUB_OUTPUT" || echo "has_dart_or_flutter_tests=false" >> "$GITHUB_OUTPUT"
          ([[ -d packaging ]] || [[ -d pkg ]] || [[ -f debian/control ]]) && echo "has_packaging=true" >> "$GITHUB_OUTPUT" || echo "has_packaging=false" >> "$GITHUB_OUTPUT"

      - id: profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "profile=private" >> "$GITHUB_OUTPUT"
          else
            echo "profile=public" >> "$GITHUB_OUTPUT"
          fi

  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "next_version=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="$INPUT_MODE"
          OVERRIDE="$INPUT_RELEASE_VERSION_OVERRIDE"

          if [[ "$MODE" == "publish-tag" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "next_version=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE" >&2; exit 1 ;;
            esac
            if command -v git-tag-inc >/dev/null 2>&1; then
              level="${level#-}"
              args=(-print-version-only "$level")
              [[ -n "$suffix" ]] && args+=("$suffix")
              next_tag=$(git-tag-inc "${args[@]}")
            else
              latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
              [[ -z "$latest" ]] && latest='0.0.0'

              if command -v npx >/dev/null 2>&1; then
                case "$level" in
                  major) bumped=$(npx --yes semver "$latest" -i major) ;;
                  minor) bumped=$(npx --yes semver "$latest" -i minor) ;;
                  *) bumped=$(npx --yes semver "$latest" -i patch) ;;
                esac
                next_tag="v${bumped}"
              else
                base="${latest%%-*}"
                IFS='.' read -r maj min pat <<< "$base"
                case "$level" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  *) pat=$((pat+1)) ;;
                esac
                next_tag="v${maj}.${min}.${pat}"
              fi

              if [[ -n "$suffix" ]]; then
                next_tag="${next_tag}-${suffix}.1"
              fi
            fi
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag format: $next_tag" >&2
            exit 1
          }

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
            else
              echo "Tag already exists and points to $REMOTE_TAG_SHA (expected ${GITHUB_SHA}): $next_tag" >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"

          clean_tag="${next_tag#v}"
          clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  release-validation:
    name: Release Validation Gate
    needs: [route, discover, prepare-release-tag, golangci, go-vet, go-test, go-test-sqlite, go-test-mysql, node-lint-test]
    if: |
      !failure() && !cancelled() &&
      needs.route.result == 'success' &&
      needs.discover.result == 'success' &&
      (needs.discover.outputs.has_go != 'true' || (needs.golangci.result == 'success' && needs.go-vet.result == 'success' && needs.go-test.result == 'success' && needs.go-test-sqlite.result == 'success' && needs.go-test-mysql.result == 'success')) &&
      (needs.discover.outputs.has_node != 'true' || needs.node-lint-test.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required language checks passed."

  release-context:
    name: Release Context & Gate
    needs: [route, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize and push tag
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          REF_TYPE: ${{ github.ref_type }}
          NEEDS_RELEASE_TAG: ${{ needs.prepare-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail

          TAG="$NEEDS_RELEASE_TAG"
          if [[ -z "$TAG" ]]; then
            TAG="$REF_NAME"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" ]]; then
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_MODE" == "publish-tag" ]]; then
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              exit 1
            fi
            echo "Running in internal publisher mode; tag is immutable context."
            exit 0
          fi

          git fetch --tags --force origin

          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi

          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $TAG already exists on remote and points to the correct SHA. Continuing safely."
            else
              echo "Tag $TAG already exists on remote but points to a different commit ($REMOTE_TAG_SHA). Failing." >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          else
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "refs/tags/$TAG"
          fi

          VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [[ -z "$VERIFY_SHA" ]]; then
            VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          if [[ "$VERIFY_SHA" != "${GITHUB_SHA}" ]]; then
            echo "Tag push failed or remote verification failed (expected ${GITHUB_SHA}, got ${VERIFY_SHA})." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
          fi

  gitleaks:
    name: Secret scan
    needs: [route, discover]
    if: ${{ needs.route.outputs.run_cleanup != 'true' && (needs.route.outputs.is_nightly == 'true' || needs.route.outputs.is_monthly == 'true' || github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks-full:
    name: Secret scan full
    needs: [route, discover]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_history == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  golangci:
    name: golangci
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest]
        tags:
          - 'nosqlite'
          - 'nosqlite,s3'
          - 'nosqlite,sendgrid'
          - 'nosqlite,ses'
          - 'nosqlite,s3,sendgrid,ses'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags '${{ matrix.tags }}'

  go-vet:
    name: Go vet
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest]
        tags:
          - 'nosqlite'
          - 'nosqlite,s3'
          - 'nosqlite,sendgrid'
          - 'nosqlite,ses'
          - 'nosqlite,s3,sendgrid,ses'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet -tags '${{ matrix.tags }}' ./...

  go-test:
    name: Go test (${{ matrix.os }})
    needs: [route, discover, golangci, go-vet]
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        tags:
          - 'nosqlite'
          - 'nosqlite,s3'
          - 'nosqlite,sendgrid'
          - 'nosqlite,ses'
          - 'nosqlite,s3,sendgrid,ses'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -tags '${{ matrix.tags }}' ./... -v

  go-test-sqlite:
    name: Go test SQLite (ubuntu-latest)
    needs: [route, discover, golangci, go-vet]
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet SQLite
        run: |
          go vet -tags sqlite ./...
          go vet -tags sqlite3 ./...
      - name: Test SQLite
        run: |
          go test -tags sqlite ./... -v
          go test -tags sqlite3 ./... -v

  go-test-mysql:
    name: Go test MySQL (ubuntu-latest)
    needs: [route, discover, golangci, go-vet]
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goa4web_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test MySQL migrations and database queries
        env:
          GOA4WEB_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/goa4web_test?parseTime=true&multiStatements=true
        run: |
          go test -tags nosqlite ./migrations ./internal/db -v

  go-fmt-pr:
    name: go fmt -> PR (manual dispatch)
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_go == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run go fmt
        run: go fmt ./...
      - name: Create PR if go fmt changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff --quiet && { echo "No fmt changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/gofmt/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: go fmt"
          git push origin "$BRANCH"
          gh pr create --title "ci: go fmt" --body "Automated go fmt from manual dispatch." --base main --head "$BRANCH" --label "ci-autofix"

  node-lint-test:
    name: Node JS tests
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_node == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: node tests/js/site.test.js

  sqlc-update:
    name: Update SQLC Output
    needs: [route, discover]
    if: ${{ needs.route.outputs.run_code_checks == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - name: Generate code
        run: |
          sqlc generate
          go run ./cmd/gen-sqlite-adapter
      - name: Check for changes
        id: diff
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true' && inputs.allow_prs != false
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(sqlc): regenerate code'
          branch: sqlc-autogen-${{ github.ref_name }}-${{ github.run_id }}
          base: ${{ github.ref_name }}
          title: 'Update sqlc generated files'
          body: |
            This PR updates generated code after SQL file changes.

  config-examples-update:
    name: Update Config Examples
    needs: [route, discover]
    if: ${{ needs.route.outputs.run_code_checks == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate examples
        run: |
          go run ./cmd/goa4web config as-env-file > examples/config.env
          go run ./cmd/goa4web config as-json > examples/config.json
      - name: Check for changes
        id: diff
        run: |
          if [[ -n $(git status --porcelain examples/config.env examples/config.json) ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            hash=$(sha1sum examples/config.env examples/config.json | sha1sum | cut -d" " -f1 | cut -c1-8)
            echo "branch_suffix=$hash" >> "$GITHUB_ENV"
          fi
      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true' && inputs.allow_prs != false
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(config): update generated examples'
          branch: config-examples-${{ env.branch_suffix }}
          base: ${{ github.ref_name }}
          title: 'Update generated config examples'
          body: |
            This PR updates example configuration files generated from the CLI.

  goreleaser:
    name: GoReleaser
    needs: [route, discover, release-context]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && needs.discover.outputs.has_goreleaser == 'true' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-tag')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            release --clean
            ${{ (contains(needs.release-context.outputs.release_tag, '-test') || contains(needs.release-context.outputs.release_tag, '-rc') || contains(needs.release-context.outputs.release_tag, '-alpha')) && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-context.outputs.release_tag }}

  autofix:
    name: Auto-format and open PR
    needs: [route, discover]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        if: ${{ needs.discover.outputs.has_go == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        if: ${{ needs.discover.outputs.has_node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Run autofix formatters
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.discover.outputs.has_go }}" == "true" ]]; then
            go fix ./... || true
            go fmt ./... || true
          fi

      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
          BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: automated formatting fixes"
          git push origin "$BRANCH"

          gh pr create \
            --title "ci: automated formatting fixes" \
            --body "Automated formatting pass. Parent-PR: ${PARENT_PR}" \
            --base main \
            --head "$BRANCH" \
            --label "ci-autofix"

  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body | \
            jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' | \
            while IFS=$'\t' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done
