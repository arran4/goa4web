openapi: 3.0.0
info:
  title: Goa4Web API
  description: API for Goa4Web Private Forum and Image Gallery
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
security:
  - bearerAuth: []

paths:
  /private/api/topics:
    get:
      summary: List existing private topics
      description: Returns a paginated list of private forum topics for the authenticated user. Requires `private_forum:read` scope and domain visibility grants.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        description:
                          type: string
                        participants:
                          type: array
                          items:
                            type: string
                        total_participants:
                          type: integer
                        threads:
                          type: integer
                        comments:
                          type: integer
                  has_more:
                    type: boolean
                  page:
                    type: integer
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new private topic
      description: Creates a new private topic and invites users. Requires `private_forum:write` scope and `privateforum:topic:create` domain grant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Topic title
                description:
                  type: string
                  description: Optional topic description
                participants:
                  type: array
                  items:
                    type: string
                  description: Array of usernames to invite. Must contain at least one valid user other than the creator.
              required:
                - title
                - participants
            encoding:
              participants:
                style: form
                explode: true
      responses:
        '200':
          description: Topic created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  topicID:
                    type: integer
        '400':
          description: Invalid input (e.g., missing title, invalid participants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (lacks permission to create topic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /private/api/topic/{topic}/threads:
    get:
      summary: List threads in a private topic
      description: Returns a paginated list of threads for a specific private topic. Requires `private_forum:read` scope and domain visibility grants.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Topic ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      type: object
                      description: Raw SQL-row structure for thread
                  has_more:
                    type: boolean
                  page:
                    type: integer
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Topic not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /private/api/topic/{topic}/thread/{thread}:
    get:
      summary: Show comments in a private thread
      description: Returns a paginated list of comments for a specific private thread. Requires `private_forum:read` scope and domain visibility grants.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Topic ID
        - in: path
          name: thread
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Thread ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        text:
                          type: string
                        html:
                          type: string
                        written:
                          type: string
                          format: date-time
                  has_more:
                    type: boolean
                  page:
                    type: integer
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Thread not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /private/api/topic/{topic}/thread/{thread}/reply:
    post:
      summary: Post a comment in a private thread
      description: Replies to an existing private thread. Requires `private_forum:write` scope and domain visibility/post grants.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Topic ID
        - in: path
          name: thread
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Thread ID
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Comment text
              required:
                - text
      responses:
        '200':
          description: Comment posted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  thread_id:
                    type: integer
                  topic_id:
                    type: integer
                  comment_id:
                    type: integer
                  url:
                    type: string
                  appended:
                    type: boolean
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Thread not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/images:
    get:
      summary: List gallery images
      description: Returns a paginated list of images uploaded by the user.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        path:
                          type: string
                        url:
                          type: string
                  has_more:
                    type: boolean
                  page:
                    type: integer

  /api/images/upload:
    post:
      summary: Upload an image
      description: Uploads an image to the user's gallery.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload
              required:
                - image
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  path:
                    type: string
                  url:
                    type: string
